
name: Build Bubble Pop Adventure APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BubblePopAdventureAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q BubblePopAdventureAndroid.zip
          test -f BubblePopAdventureAndroid/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd BubblePopAdventureAndroid
          gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Pop-Adventure-APK
          path: BubblePopAdventureAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
